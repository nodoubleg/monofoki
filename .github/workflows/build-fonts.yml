name: Build fonts

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fontforge python3-fontforge python3-fonttools ttfautohint woff2 curl unzip

      - name: Check source glyphs
        run: |
          python3 script_helper/add_braille.py --check
          fontforge -lang=py -script script_helper/add_terminal_symbols.py --check
          python3 script_helper/check_unicode_data.py
          fontforge -lang=py -script script_helper/check_terminal_glyphs.py

      - name: Build all four styles with hinting
        run: ./create_font.sh --hint

      - name: Validate regular font exports
        run: |
          for style in Regular Italic Bold Bold-Italic; do
            for suffix in .ttf -hinted.ttf .otf .woff2 -hinted.woff2; do
              test -s "export/Monofoki-${style}${suffix}"
            done
          done
          test -s export/LICENSE-Monofoki
          test -s export/LICENSE-Iosevka
          test -s export/LICENSE-NotoSansSymbols2
          test -s export/LICENSE-KreativeSquare
          fontforge -lang=py -script script_helper/check_terminal_glyphs.py \
            export/*.ttf export/*.otf

      - name: Upload regular Monofoki
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Monofoki-${{ github.sha }}
          path: export/
          if-no-files-found: error
          retention-days: 30

      - name: Build and validate Nerd Font variants
        run: |
          ./post_create_nerdfonts.sh
          for style in Regular Italic Bold BoldItalic; do
            test -s "export/MonofokiNerdFont-${style}.ttf"
            test -s "export/MonofokiNerdFont-${style}.otf"
            woff2_compress "export/MonofokiNerdFont-${style}.otf"
            test -s "export/MonofokiNerdFont-${style}.woff2"
          done
          test -s export/LICENSE-nerd-font
          test -s export/license-audit-nerd-font.md
          fontforge -lang=py -script script_helper/check_terminal_glyphs.py \
            export/MonofokiNerdFont-*.ttf export/MonofokiNerdFont-*.otf

      - name: Upload Monofoki Nerd Font
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MonofokiNerdFont-${{ github.sha }}
          path: |
            export/MonofokiNerdFont-*
            export/LICENSE-*
            export/NOTICES-symbols.md
            export/symbol-additions.json
            export/build-dependencies.json
            export/license-audit-nerd-font.md
          if-no-files-found: error
          retention-days: 30

  site:
    name: Build specimen site and recording
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out site and demo sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download this run's regular fonts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Monofoki-${{ github.sha }}
          path: ${{ runner.temp }}/fonts/regular

      - name: Download this run's Nerd Font variants
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MonofokiNerdFont-${{ github.sha }}
          path: ${{ runner.temp }}/fonts/nerd

      - name: Stage the site with CI webfonts
        env:
          FONT_REVISION: ${{ github.sha }}
          FONT_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 script_helper/build_site.py \
            --regular "$RUNNER_TEMP/fonts/regular" \
            --nerd "$RUNNER_TEMP/fonts/nerd" \
            --revision "$FONT_REVISION" --build-url "$FONT_BUILD_URL"

      - name: Install VHS and recording dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg ttyd fontconfig
          mkdir -p "$RUNNER_TEMP/vhs"
          curl --fail --location --show-error \
            https://github.com/charmbracelet/vhs/releases/download/v0.12.1/vhs_0.12.1_Linux_x86_64.tar.gz \
            -o "$RUNNER_TEMP/vhs.tar.gz"
          echo "eb33787a5b1cebf91fe0b18bd231e2d71d36c1ff4babd99ddac1a6ab411efd10  $RUNNER_TEMP/vhs.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vhs.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/vhs"
          echo "$RUNNER_TEMP/vhs" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/fonts"
          cp "$RUNNER_TEMP/fonts/nerd/"*.otf "$HOME/.local/share/fonts/"
          fc-cache -f
          fc-match 'Monofoki Nerd Font' | grep -q MonofokiNerdFont

      - name: Record the font specimen
        run: |
          vhs website/demo.tape
          test -s _site/media/monofoki.mp4
          # VHS Screenshot waits for a changed frame, which can capture the next
          # command after a static scene. Use the final, held artwork frame.
          ffmpeg -hide_banner -loglevel error -sseof -0.2 \
            -i _site/media/monofoki.mp4 -frames:v 1 _site/media/demo-poster.png
          test -s _site/media/demo-poster.png
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 _site/media/monofoki.mp4

      - name: Upload the generated Pages bundle
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: site
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the specimen
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
